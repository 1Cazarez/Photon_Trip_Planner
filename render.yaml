# Render blueprint (README §7b).
# TODO(J, #2): run `uv lock` and commit agent/uv.lock; `uv sync --frozen` fails without it.
# TODO(J, #4): confirm region, plan, and Python version against Render's current options,
#   then apply via Render dashboard -> New -> Blueprint.
services:
  - type: web
    name: photon-agent
    runtime: python
    rootDir: agent
    region: oregon          # match the Supabase region as closely as possible
    plan: starter           # paid; free instances sleep and miss scheduled jobs
    numInstances: 1         # scheduler runs in-process; more instances = duplicate sends
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: FLIGHT_API_KEY
        sync: false
      - key: MAPS_API_KEY
        sync: false
      - key: SPECTRUM_API_KEY
        sync: false
      - key: BRIDGE_URL
        sync: false
      - key: AGENT_SHARED_SECRET
        generateValue: true

